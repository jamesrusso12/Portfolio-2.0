<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Test</title>
    <style>
        body {
            padding: 20px;
            background: #1a1a1a;
            color: white;
        }
        .test-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }
        .test-grid img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border: 2px solid #00cfff;
        }
        h2 {
            color: #00cfff;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <h1>Image Loading Test</h1>

    <h2>Web Development Images</h2>
    <div class="test-grid">
        <img src="../img/WebDevelopment (1).JPG" alt="Web 1">
        <img src="../img/WebDevelopment (2).JPG" alt="Web 2">
        <img src="../img/WebDevelopment (3).JPG" alt="Web 3">
    </div>

    <h2>Game Development Images (Unity - JPG)</h2>
    <div class="test-grid">
        <img src="../img/GameDevelopment (1).JPG" alt="Game 1">
        <img src="../img/GameDevelopment (2).jpg" alt="Game 2">
        <img src="../img/GameDevelopment (3).JPG" alt="Game 3">
    </div>

    <h2>Game Development Images (Unreal - PNG)</h2>
    <div class="test-grid">
        <img src="../img/GameDevelopment (1).png" alt="Unreal 1">
        <img src="../img/GameDevelopment (2).png" alt="Unreal 2">
        <img src="../img/GameDevelopment (3).png" alt="Unreal 3">
    </div>

    <h2>App Development Images</h2>
    <div class="test-grid">
        <img src="../img/AppDevelopment.jpg" alt="App Main">
        <img src="../img/AppDevelopment (1).jpg" alt="App 1">
        <img src="../img/AppDevelopment (2).jpg" alt="App 2">
    </div>
</body>
</html>
